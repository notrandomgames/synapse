<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synapse</title>
    
    <!-- Highlight.js Atom One Dark -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <!-- Marked.js & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-main: #18181b;
            --bg-sidebar: #121215;
            --bg-card: #202024;
            --bg-card-hover: #28282d;
            --bg-input: #222226;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-warm: #d97706;
            --accent-blue: #a8c7fa;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-serif: "Georgia", "Cambria", serif;
        }

        body.light-theme {
            --bg-main: #fcfcfc;
            --bg-sidebar: #f4f4f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f1f3;
            --bg-input: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --accent-warm: #d97706;
            --accent-blue: #2563eb;
        }

        body.theme-obsidian {
            --bg-main: #090d16;
            --bg-sidebar: #05070c;
            --bg-card: #111827;
            --bg-card-hover: #1f2937;
            --bg-input: #111827;
            --border-color: rgba(16, 185, 129, 0.2);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --accent-warm: #10b981;
            --accent-blue: #06b6d4;
        }

        body.theme-midnight {
            --bg-main: #0f0c1b;
            --bg-sidebar: #090710;
            --bg-card: #18142a;
            --bg-card-hover: #231d3d;
            --bg-input: #18142a;
            --border-color: rgba(168, 85, 247, 0.2);
            --text-primary: #f5f3ff;
            --text-secondary: #a78bfa;
            --accent-warm: #ec4899;
            --accent-blue: #8b5cf6;
        }

        body.theme-sunset {
            --bg-main: #1c1917;
            --bg-sidebar: #141210;
            --bg-card: #292524;
            --bg-card-hover: #383230;
            --bg-input: #292524;
            --border-color: rgba(249, 115, 22, 0.2);
            --text-primary: #f5f5f4;
            --text-secondary: #a8a29e;
            --accent-warm: #f97316;
            --accent-blue: #eab308;
        }

        body.theme-paper {
            --bg-main: #fcfbf7;
            --bg-sidebar: #f4f1ea;
            --bg-card: #ffffff;
            --bg-card-hover: #f1ede4;
            --bg-input: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #292524;
            --text-secondary: #78716c;
            --accent-warm: #ea580c;
            --accent-blue: #0284c7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        body { display: flex; transition: background-color 0.3s, color 0.3s; }

        /* Touch Precision & Mobile Ergonomics */
        button, input, textarea, .card, .history-item, .brand-logo {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .action-btn, .toggle-sidebar-btn, .mobile-menu-btn, .action-icon-btn, .send-btn {
            min-height: 44px;
            min-width: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Smooth Chat Entrance Animation */
        @keyframes chatFadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px) scale(0.99);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-chat-open {
            animation: chatFadeIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 40;
        }

        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            transition: transform 0.3s ease, width 0.3s ease, padding 0.3s ease;
            position: relative;
            flex-shrink: 0;
            z-index: 50;
        }

        aside.collapsed { width: 68px; padding: 16px 10px; }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .brand-logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        .brand-svg-logo {
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px var(--accent-warm));
            transition: filter 0.3s ease, transform 0.2s ease;
        }

        .brand-logo:hover .brand-svg-logo {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px var(--accent-blue));
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 6px;
        }

        .toggle-sidebar-btn:hover { background-color: var(--bg-card); color: var(--text-primary); }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            overflow: hidden;
            min-height: 44px;
        }

        .new-chat-btn:hover { background-color: var(--bg-card-hover); }

        .search-container { padding: 0 2px; }

        .search-box {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        aside.collapsed .chat-history, 
        aside.collapsed .history-title,
        aside.collapsed .brand-text,
        aside.collapsed .btn-text,
        aside.collapsed .search-container { display: none; }

        .history-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .history-item {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            min-height: 44px;
        }

        .history-item:hover, .history-item.active { background-color: var(--bg-card); color: var(--text-primary); }

        .history-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .item-actions { display: none; gap: 2px; }

        .history-item:hover .item-actions, .history-item.active .item-actions { display: flex; }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            min-height: 36px; min-width: 36px;
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .settings-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            min-height: 44px;
        }

        .settings-btn:hover { background-color: var(--bg-card); color: var(--text-primary); }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .mobile-header {
            display: none;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .mobile-menu-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .content-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .welcome-section { margin-top: 40px; margin-bottom: 16px; flex-shrink: 0; }

        .welcome-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .welcome-subtitle { font-size: 1.05rem; color: var(--text-secondary); font-weight: 400; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            margin-bottom: auto;
            flex-shrink: 0;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover { background-color: var(--bg-card-hover); border-color: var(--accent-warm); }

        .card-text { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.4; }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            scroll-behavior: smooth;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-right: 6px;
            margin-bottom: 16px;
            min-height: 0;
        }

        .message { display: flex; gap: 12px; line-height: 1.6; flex-shrink: 0; }

        .message.user .message-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            margin-left: auto;
        }

        .message.ai .avatar-svg { flex-shrink: 0; margin-top: 2px; }

        .message-content { font-size: 0.95rem; color: var(--text-primary); word-break: break-word; width: 100%; }

        .message-content pre {
            background: #282c34;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .copy-code-btn {
            position: absolute;
            top: 8px; right: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            min-height: 36px;
        }

        .input-wrapper { flex-shrink: 0; width: 100%; }

        .input-container {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-container:focus-within { border-color: var(--accent-warm); }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            overflow-y: auto;
        }

        .input-controls { display: flex; justify-content: space-between; align-items: center; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-warm), var(--accent-blue));
            border: none;
            width: 44px; height: 44px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .footer-text { font-size: 0.72rem; color: var(--text-secondary); text-align: center; margin-top: 8px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            width: 100%; max-width: 420px;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; }

        .setting-group { display: flex; justify-content: space-between; align-items: center; }

        .setting-select, .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            min-height: 44px;
        }

        .danger-btn {
            background: #ef4444; color: #fff;
            border: none; padding: 10px 14px;
            border-radius: 6px; cursor: pointer;
            min-height: 44px;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar-overlay.active { display: block; }
            aside {
                position: fixed;
                top: 0; left: 0;
                height: 100vh; height: 100dvh;
                width: 280px !important;
                transform: translateX(-100%);
            }
            aside.mobile-open { transform: translateX(0); }
            main { padding: 12px; height: 100dvh; }
            .welcome-title { font-size: 2.1rem; }
            .cards-grid { grid-template-columns: 1fr; gap: 10px; }
            .message.user .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

    <aside id="sidebar">
        <div class="brand">
            <div class="brand-logo" onclick="startNewChat()">
                <svg class="brand-svg-logo" viewBox="0 0 100 100" width="28" height="28">
                    <defs>
                        <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--accent-warm, #d97706)"/>
                            <stop offset="100%" stop-color="var(--accent-blue, #a8c7fa)"/>
                        </linearGradient>
                    </defs>
                    <path d="M 65 25 C 40 15, 25 40, 50 50 C 75 60, 60 85, 35 75" fill="none" stroke="url(#synapseGlow)" stroke-width="7" stroke-linecap="round"/>
                    <circle cx="65" cy="25" r="4" fill="var(--accent-blue)"/>
                    <circle cx="35" cy="75" r="4" fill="var(--accent-warm)"/>
                    <circle cx="50" cy="50" r="6" fill="url(#synapseGlow)"/>
                    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
                </svg>
                <span class="brand-text">Synapse</span>
            </div>
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <span>+</span>
            <span class="btn-text">New chat</span>
        </button>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search chats..." oninput="filterChats(this.value)">
        </div>

        <div class="chat-history">
            <div id="pinnedSection" style="display: none;">
                <div class="history-title">Pinned</div>
                <div id="pinnedHistoryList"></div>
            </div>
            
            <div class="history-title">Recent</div>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-footer">
            <button class="settings-btn" onclick="openSettings()">
                <span>⚙</span>
                <span class="btn-text">Settings</span>
            </button>
        </div>
    </aside>

    <main>
        <div class="mobile-header">
            <button class="mobile-menu-btn" onclick="openMobileSidebar()">☰</button>
            <div class="brand-logo" onclick="startNewChat()">
                <span style="font-weight: 600;">Synapse</span>
            </div>
            <button class="mobile-menu-btn" onclick="startNewChat()">+</button>
        </div>

        <div class="content-container">
            <div class="welcome-section" id="welcomeSection">
                <h1 class="welcome-title">Good day</h1>
                <h2 class="welcome-subtitle">Where would you like to begin?</h2>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div class="input-wrapper">
                <div class="input-container">
                    <div id="imagePreviewContainer" style="display: none; position: relative; width: fit-content;">
                        <img id="imagePreview" src="" style="max-height: 80px; border-radius: 8px;">
                        <button onclick="removeSelectedImage()" style="position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px;">✕</button>
                    </div>
                    <textarea class="input-box" id="userInput" placeholder="How can Synapse help you today?" rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-controls">
                        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                        <button class="action-btn" onclick="document.getElementById('fileInput').click()">📎 Attach</button>
                        <button class="action-btn" onclick="fillRandomPrompt()">🎲 Surprise</button>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
                <p class="footer-text">Synapse uses AES-GCM 256-bit client encryption for local chats.</p>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Settings</h3>
                <button onclick="closeSettings()" style="background:none; border:none; color:var(--text-secondary); font-size:1.2rem;">✕</button>
            </div>
            
            <div class="setting-group">
                <span>Theme</span>
                <select class="setting-select" id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark</option>
                    <option value="light-theme">Light</option>
                    <option value="theme-obsidian">Obsidian</option>
                    <option value="theme-midnight">Midnight</option>
                    <option value="theme-sunset">Sunset</option>
                    <option value="theme-paper">Paper</option>
                </select>
            </div>

            <div class="setting-group">
                <span>Clear History</span>
                <button class="danger-btn" onclick="clearAllData()">Clear All Data</button>
            </div>
        </div>
    </div>

    <script>
        // Web Crypto API 256-bit AES-GCM Client Encryption Engine
        const ENCRYPTION_KEY_NAME = 'synapse_master_sec';

        async function getOrCreateKey() {
            let rawKey = localStorage.getItem(ENCRYPTION_KEY_NAME);
            if (!rawKey) {
                const key = await window.crypto.subtle.generateKey(
                    { name: "AES-GCM", length: 256 },
                    true,
                    ["encrypt", "decrypt"]
                );
                const exported = await window.crypto.subtle.exportKey("jwk", key);
                localStorage.setItem(ENCRYPTION_KEY_NAME, JSON.stringify(exported));
                return key;
            }
            return await window.crypto.subtle.importKey(
                "jwk",
                JSON.parse(rawKey),
                { name: "AES-GCM" },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptData(dataString) {
            const key = await getOrCreateKey();
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(dataString);
            const cipherText = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                key,
                encoded
            );
            return JSON.stringify({
                iv: Array.from(iv),
                data: Array.from(new Uint8Array(cipherText))
            });
        }

        async function decryptData(encryptedJson) {
            try {
                const { iv, data } = JSON.parse(encryptedJson);
                const key = await getOrCreateKey();
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: new Uint8Array(iv) },
                    key,
                    new Uint8Array(data)
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return "[]";
            }
        }

        // App State
        let chatSessions = [];
        let currentSessionId = null;
        let selectedImageBase64 = null;
        let selectedImageMimeType = null;

        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const welcomeSection = document.getElementById('welcomeSection');
        const cardsGrid = document.getElementById('cardsGrid');
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const historyList = document.getElementById('historyList');
        const pinnedHistoryList = document.getElementById('pinnedHistoryList');
        const pinnedSection = document.getElementById('pinnedSection');
        const settingsModal = document.getElementById('settingsModal');
        const themeSelect = document.getElementById('themeSelect');
        const searchInput = document.getElementById('searchInput');

        const promptBank = [
            "Explain quantum computing principles clearly using simple analogies.",
            "What were the pivotal economic causes behind the fall of Rome?",
            "Write a clean JavaScript algorithm for binary tree traversal.",
            "Outline a comprehensive 14-day training plan for a half marathon."
        ];

        // Initialize App
        (async function init() {
            const savedTheme = localStorage.getItem('synapse_theme') || 'dark';
            changeTheme(savedTheme);
            themeSelect.value = savedTheme;

            marked.setOptions({
                highlight: (code, lang) => {
                    if (lang && hljs.getLanguage(lang)) {
                        return hljs.highlight(code, { language: lang }).value;
                    }
                    return hljs.highlightAuto(code).value;
                },
                breaks: true
            });

            await loadSessionsFromStorage();
            randomizePromptCards();
            renderHistory();
        })();

        async function saveSessionsToStorage() {
            const encrypted = await encryptData(JSON.stringify(chatSessions));
            localStorage.setItem('synapse_chats_encrypted', encrypted);
        }

        async function loadSessionsFromStorage() {
            const encrypted = localStorage.getItem('synapse_chats_encrypted');
            if (encrypted) {
                const decrypted = await decryptData(encrypted);
                chatSessions = JSON.parse(decrypted || "[]");
            }
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedImageMimeType = file.type;
            const reader = new FileReader();
            reader.onload = (e) => {
                const fullBase64 = e.target.result;
                selectedImageBase64 = fullBase64.split(',')[1];
                document.getElementById('imagePreview').src = fullBase64;
                document.getElementById('imagePreviewContainer').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage() {
            selectedImageBase64 = null;
            selectedImageMimeType = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        function randomizePromptCards() {
            const shuffled = [...promptBank].sort(() => 0.5 - Math.random()).slice(0, 2);
            cardsGrid.innerHTML = shuffled.map(p => `
                <div class="card" onclick="sendPrompt('${p.replace(/'/g, "\\'")}')">
                    <p class="card-text">${p}</p>
                </div>
            `).join('');
        }

        function fillRandomPrompt() {
            userInput.value = promptBank[Math.floor(Math.random() * promptBank.length)];
            userInput.focus();
        }

        function openMobileSidebar() {
            sidebar.classList.add('mobile-open');
            sidebarOverlay.classList.add('active');
        }

        function closeMobileSidebar() {
            sidebar.classList.remove('mobile-open');
            sidebarOverlay.classList.remove('active');
        }

        function toggleSidebar() {
            if (window.innerWidth <= 768) closeMobileSidebar();
            else sidebar.classList.toggle('collapsed');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendPrompt(promptText) {
            userInput.value = promptText;
            sendMessage();
        }

        function scrollToBottom() {
            setTimeout(() => { messagesContainer.scrollTop = messagesContainer.scrollHeight; }, 50);
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text && !selectedImageBase64) return;

            // Disable Send button during stream
            sendBtn.disabled = true;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';

            if (!currentSessionId) {
                currentSessionId = Date.now().toString();
                chatSessions.unshift({ id: currentSessionId, title: text || "Image Analysis", messages: [], pinned: false });
            }

            const currentImage = selectedImageBase64;
            const currentMime = selectedImageMimeType;
            removeSelectedImage();

            const activeSession = chatSessions.find(s => s.id === currentSessionId);
            const historyPayload = activeSession ? activeSession.messages.map(m => ({
                role: m.sender === 'user' ? 'user' : 'model',
                parts: [{ text: m.content }]
            })) : [];

            appendMessage(text || "[Attached Image]", 'user');
            await saveMessageToSession('user', text || "[Attached Image]");
            userInput.value = '';

            appendMessage("", 'ai');
            const aiMessages = messagesContainer.querySelectorAll('.message.ai .message-content');
            const loadingElement = aiMessages[aiMessages.length - 1];

            let streamedText = "";

            try {
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: text,
                        history: historyPayload,
                        imageBase64: currentImage, 
                        mimeType: currentMime 
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    loadingElement.innerText = "Error: " + errText;
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    streamedText += decoder.decode(value, { stream: true });
                    loadingElement.innerHTML = marked.parse(streamedText);
                    scrollToBottom();
                }

                attachCopyButtons(loadingElement.parentElement);
                await saveMessageToSession('ai', streamedText);

            } catch (err) {
                loadingElement.innerText = "Error connecting to backend server: " + err.message;
            } finally {
                sendBtn.disabled = false;
            }

            scrollToBottom();
            renderHistory();
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const formattedContent = sender === 'ai' ? (text ? marked.parse(text) : 'Thinking...') : text;

            const aiAvatarSVG = `
                <svg class="avatar-svg brand-svg-logo" viewBox="0 0 100 100" width="26" height="26">
                    <path d="M 65 25 C 40 15, 25 40, 50 50 C 75 60, 60 85, 35 75" fill="none" stroke="url(#synapseGlow)" stroke-width="7" stroke-linecap="round"/>
                    <circle cx="65" cy="25" r="4" fill="var(--accent-blue)"/>
                    <circle cx="35" cy="75" r="4" fill="var(--accent-warm)"/>
                    <circle cx="50" cy="50" r="6" fill="url(#synapseGlow)"/>
                    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
                </svg>
            `;

            messageDiv.innerHTML = sender === 'ai' 
                ? `${aiAvatarSVG}<div class="message-content">${formattedContent}</div>`
                : `<div class="message-content">${text}</div>`;

            messagesContainer.appendChild(messageDiv);
            if (sender === 'ai' && text) attachCopyButtons(messageDiv);
            scrollToBottom();
        }

        function attachCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-code-btn')) return;
                const button = document.createElement('button');
                button.className = 'copy-code-btn';
                button.innerText = 'Copy';
                button.onclick = () => {
                    const code = pre.querySelector('code').innerText;
                    navigator.clipboard.writeText(code).then(() => {
                        button.innerText = 'Copied!';
                        setTimeout(() => button.innerText = 'Copy', 2000);
                    });
                };
                pre.appendChild(button);
            });
        }

        async function saveMessageToSession(sender, content) {
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages.push({ sender, content });
                await saveSessionsToStorage();
            }
        }

        function renderHistory() {
            renderFilteredHistory(chatSessions);
        }

        function filterChats(query) {
            const term = query.toLowerCase().trim();
            const filtered = chatSessions.filter(s => 
                s.title.toLowerCase().includes(term) || 
                s.messages.some(m => m.content.toLowerCase().includes(term))
            );
            renderFilteredHistory(filtered);
        }

        function renderFilteredHistory(sessions) {
            historyList.innerHTML = '';
            pinnedHistoryList.innerHTML = '';

            const pinned = sessions.filter(s => s.pinned);
            const unpinned = sessions.filter(s => !s.pinned);

            if (pinned.length > 0) {
                pinnedSection.style.display = 'block';
                pinned.forEach(s => pinnedHistoryList.appendChild(createChatItem(s)));
            } else pinnedSection.style.display = 'none';

            unpinned.forEach(s => historyList.appendChild(createChatItem(s)));
        }

        function createChatItem(session) {
            const item = document.createElement('div');
            item.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
            item.innerHTML = `<span class="history-item-title">${session.title}</span>`;

            const actions = document.createElement('div');
            actions.className = 'item-actions';

            const pinBtn = document.createElement('button');
            pinBtn.className = 'action-icon-btn';
            pinBtn.innerText = session.pinned ? '📌' : '📍';
            pinBtn.onclick = (e) => { e.stopPropagation(); session.pinned = !session.pinned; saveSessionsToStorage(); renderHistory(); };

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'action-icon-btn';
            deleteBtn.innerText = '🗑️';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm("Delete this chat?")) {
                    chatSessions = chatSessions.filter(s => s.id !== session.id);
                    saveSessionsToStorage();
                    if (currentSessionId === session.id) startNewChat();
                    else renderHistory();
                }
            };

            actions.appendChild(pinBtn);
            actions.appendChild(deleteBtn);
            item.appendChild(actions);

            item.onclick = () => { loadSession(session.id); closeMobileSidebar(); };
            return item;
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = chatSessions.find(s => s.id === id);
            if (!session) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';
            messagesContainer.innerHTML = '';

            // Trigger opening animation on session load
            messagesContainer.classList.remove('animate-chat-open');
            void messagesContainer.offsetWidth; // Force CSS reflow
            messagesContainer.classList.add('animate-chat-open');

            session.messages.forEach(m => appendMessage(m.content, m.sender));
            renderHistory();
            scrollToBottom();
        }

        function startNewChat() {
            currentSessionId = null;
            messagesContainer.innerHTML = '';
            messagesContainer.style.display = 'none';
            
            // Animate welcome section on new chat creation
            welcomeSection.style.display = 'block';
            cardsGrid.style.display = 'grid';
            
            const contentBox = document.querySelector('.content-container');
            contentBox.classList.remove('animate-chat-open');
            void contentBox.offsetWidth; // Force CSS reflow
            contentBox.classList.add('animate-chat-open');

            userInput.value = '';
            removeSelectedImage();
            randomizePromptCards();
            renderHistory();
            closeMobileSidebar();
        }

        function openSettings() { closeMobileSidebar(); settingsModal.style.display = 'flex'; }
        function closeSettings() { settingsModal.style.display = 'none'; }

        function changeTheme(theme) {
            document.body.className = theme === 'dark' ? '' : theme;
            localStorage.setItem('synapse_theme', theme);
        }

        async function clearAllData() {
            if (confirm("Clear all saved encrypted chats?")) {
                localStorage.removeItem('synapse_chats_encrypted');
                chatSessions = [];
                startNewChat();
                closeSettings();
            }
        }
    </script>
</body>
</html>
