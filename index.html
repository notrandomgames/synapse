<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE // NEURAL INTERFACE</title>
    <style>
        :root {
            --bg-dark: #05070f;
            --bg-sidebar: #090d1a;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(56, 189, 248, 0.2);
            --neon-cyan: #00f0ff;
            --neon-purple: #7000ff;
            --neon-pink: #ff007f;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-main); }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 240, 255, 0.12) 0%, transparent 40%);
        }

        /* Futuristic Sidebar */
        aside {
            width: 280px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 20px;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .brand-orb {
            width: 14px;
            height: 14px;
            background: var(--neon-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-cyan), 0 0 30px var(--neon-cyan);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .new-chat-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(112, 0, 255, 0.2));
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.15);
        }

        .new-chat-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-title {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-dim);
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }

        .history-item:hover, .history-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border-color: var(--glass-border);
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* Main Glass Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
            position: relative;
        }

        .content-container {
            width: 100%;
            max-width: 850px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-section {
            margin-top: 60px;
            text-align: center;
        }

        .welcome-title {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }

        .welcome-subtitle {
            font-size: 1.1rem;
            color: var(--text-dim);
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 40px;
            margin-bottom: auto;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--neon-cyan);
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        .card-text {
            font-size: 0.9rem;
            color: var(--text-main);
        }

        /* Chat Window */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-right: 12px;
            margin-bottom: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user .message-content {
            background: linear-gradient(135deg, rgba(112, 0, 255, 0.3), rgba(0, 240, 255, 0.15));
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 16px 16px 2px 16px;
            margin-left: auto;
            max-width: 80%;
        }

        .message.ai .avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
            border-radius: 8px;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .message-content {
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Futuristic Input Field */
        .input-container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: border-color 0.3s;
        }

        .input-container:focus-within {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.25);
        }

        .input-box {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            height: 24px;
        }

        .send-btn {
            background: var(--neon-cyan);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: scale(1.05);
        }

        .footer-text {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <div class="brand-orb"></div>
            <span>SYNAPSE</span>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New Session</button>
        <div class="chat-history">
            <div class="history-title">Saved Neural Logs</div>
            <div id="historyList"></div>
        </div>
    </aside>

    <main>
        <div class="content-container">
            
            <div class="welcome-section" id="welcomeSection">
                <h1 class="welcome-title">SYSTEM ONLINE</h1>
                <h2 class="welcome-subtitle">Awaiting query parameters to execute neural tasks...</h2>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <div class="card" onclick="sendPrompt('Explain quantum neural networks in simple terms')">
                    <p class="card-text">Explain quantum neural networks in simple terms</p>
                </div>
                <div class="card" onclick="sendPrompt('Write a futuristic Python script for automated telemetry analytics')">
                    <p class="card-text">Write a futuristic Python script for automated telemetry analytics</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div>
                <div class="input-container">
                    <textarea class="input-box" id="userInput" placeholder="Transmit query..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <button class="send-btn" onclick="sendMessage()">➔</button>
                </div>
                <p class="footer-text">SYNAPSE NEURAL LINK // PERSISTENT STORAGE ACTIVE</p>
            </div>

        </div>
    </main>

    <script>
        const welcomeSection = document.getElementById('welcomeSection');
        const cardsGrid = document.getElementById('cardsGrid');
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const historyList = document.getElementById('historyList');

        let chatSessions = JSON.parse(localStorage.getItem('synapse_chats')) || [];
        let currentSessionId = null;

        // Initialize history list on startup
        renderHistory();

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendPrompt(promptText) {
            userInput.value = promptText;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';

            // Create new session if starting fresh
            if (!currentSessionId) {
                currentSessionId = Date.now().toString();
                chatSessions.unshift({ id: currentSessionId, title: text, messages: [] });
            }

            // Append & store user message
            appendMessage(text, 'user');
            saveMessageToSession('user', text);
            userInput.value = '';

            // AI loading indicator
            appendMessage("Processing query...", 'ai');
            const aiMessages = messagesContainer.querySelectorAll('.message.ai .message-content');
            const loadingElement = aiMessages[aiMessages.length - 1];

            try {
                const response = await fetch('/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                let aiResponseText = "";

                if (data.error) {
                    aiResponseText = "System Error: " + data.error;
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiResponseText = data.candidates[0].content.parts[0].text;
                } else {
                    aiResponseText = "Error: Invalid data structure returned.";
                }

                loadingElement.innerText = aiResponseText;
                saveMessageToSession('ai', aiResponseText);

            } catch (err) {
                loadingElement.innerText = "Error: Connection lost to neural backend.";
            }

            renderHistory();
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = sender === 'ai' 
                ? `<div class="avatar"></div><div class="message-content">${text}</div>`
                : `<div class="message-content">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function saveMessageToSession(sender, content) {
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages.push({ sender, content });
                localStorage.setItem('synapse_chats', JSON.stringify(chatSessions));
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            chatSessions.forEach(session => {
                const item = document.createElement('div');
                item.classList.add('history-item');
                if (session.id === currentSessionId) item.classList.add('active');
                item.innerText = session.title;
                item.onclick = () => loadSession(session.id);
                historyList.appendChild(item);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = chatSessions.find(s => s.id === id);
            if (!session) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';
            messagesContainer.innerHTML = '';

            session.messages.forEach(msg => appendMessage(msg.content, msg.sender));
            renderHistory();
        }

        function startNewChat() {
            currentSessionId = null;
            messagesContainer.innerHTML = '';
            messagesContainer.style.display = 'none';
            welcomeSection.style.display = 'block';
            cardsGrid.style.display = 'grid';
            userInput.value = '';
            renderHistory();
        }
    </script>
</body>
</html>
