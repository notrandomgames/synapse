<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <style>
        :root {
            /* Hybrid Palette: Gemini Dark + Claude Warmth */
            --bg-main: #18181b;
            --bg-sidebar: #121215;
            --bg-card: #202024;
            --bg-card-hover: #28282d;
            --bg-input: #222226;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-warm: #d97706; /* Claude Warm Amber */
            --accent-blue: #a8c7fa; /* Gemini Soft Blue */
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-serif: "Georgia", "Cambria", serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Minimal Sidebar (Claude/Gemini style) */
        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-warm), var(--accent-blue));
        }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Claude-inspired Elegant Header */
        .welcome-section {
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Gemini-style Prompt Cards */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 24px;
            margin-bottom: auto;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            background-color: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-text {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Messages Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-right: 8px;
            margin-bottom: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 80%;
            margin-left: auto;
        }

        .message.ai .avatar {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, var(--accent-warm), var(--accent-blue));
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        /* Clean Hybrid Input Box */
        .input-container {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.98rem;
            resize: none;
            height: 24px;
        }

        .input-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .send-btn {
            background: var(--text-primary);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: var(--bg-main);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.88;
        }

        .footer-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <div class="brand-icon"></div>
            <span>Synapse</span>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New chat</button>
        <div class="chat-history">
            <div class="history-title">Recent</div>
            <div id="historyList"></div>
        </div>
    </aside>

    <main>
        <div class="content-container">
            
            <div class="welcome-section" id="welcomeSection">
                <h1 class="welcome-title">Good day</h1>
                <h2 class="welcome-subtitle">Where would you like to begin?</h2>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <div class="card" onclick="sendPrompt('Explain neural networks in simple terms')">
                    <p class="card-text">Explain neural networks in simple terms</p>
                </div>
                <div class="card" onclick="sendPrompt('Help me brainstorm ideas for a web app')">
                    <p class="card-text">Help me brainstorm ideas for a web app</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div>
                <div class="input-container">
                    <textarea class="input-box" id="userInput" placeholder="How can Synapse help you today?" rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-controls">
                        <button class="send-btn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
                <p class="footer-text">Synapse can make mistakes. Verify important info.</p>
            </div>

        </div>
    </main>

    <script>
        const welcomeSection = document.getElementById('welcomeSection');
        const cardsGrid = document.getElementById('cardsGrid');
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const historyList = document.getElementById('historyList');

        let chatSessions = JSON.parse(localStorage.getItem('synapse_chats')) || [];
        let currentSessionId = null;

        renderHistory();

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendPrompt(promptText) {
            userInput.value = promptText;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';

            if (!currentSessionId) {
                currentSessionId = Date.now().toString();
                chatSessions.unshift({ id: currentSessionId, title: text, messages: [] });
            }

            appendMessage(text, 'user');
            saveMessageToSession('user', text);
            userInput.value = '';

            appendMessage("Thinking...", 'ai');
            const aiMessages = messagesContainer.querySelectorAll('.message.ai .message-content');
            const loadingElement = aiMessages[aiMessages.length - 1];

            try {
                const response = await fetch('/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                let aiResponseText = "";

                if (data.error) {
                    aiResponseText = "Error: " + data.error;
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiResponseText = data.candidates[0].content.parts[0].text;
                } else {
                    aiResponseText = "Error: Invalid response format.";
                }

                loadingElement.innerText = aiResponseText;
                saveMessageToSession('ai', aiResponseText);

            } catch (err) {
                loadingElement.innerText = "Error connecting to serverless function.";
            }

            renderHistory();
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = sender === 'ai' 
                ? `<div class="avatar"></div><div class="message-content">${text}</div>`
                : `<div class="message-content">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function saveMessageToSession(sender, content) {
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages.push({ sender, content });
                localStorage.setItem('synapse_chats', JSON.stringify(chatSessions));
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            chatSessions.forEach(session => {
                const item = document.createElement('div');
                item.classList.add('history-item');
                if (session.id === currentSessionId) item.classList.add('active');
                item.innerText = session.title;
                item.onclick = () => loadSession(session.id);
                historyList.appendChild(item);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = chatSessions.find(s => s.id === id);
            if (!session) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';
            messagesContainer.innerHTML = '';

            session.messages.forEach(msg => appendMessage(msg.content, msg.sender));
            renderHistory();
        }

        function startNewChat() {
            currentSessionId = null;
            messagesContainer.innerHTML = '';
            messagesContainer.style.display = 'none';
            welcomeSection.style.display = 'block';
            cardsGrid.style.display = 'grid';
            userInput.value = '';
            renderHistory();
        }
    </script>
</body>
</html>
