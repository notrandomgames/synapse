<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse AI</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --bg-card: #1e1f20;
            --bg-card-hover: #2a2b2d;
            --bg-input: #1e1f20;
            --text-primary: #e3e3e3;
            --text-secondary: #c4c7c5;
            --accent-blue: #a8c7fa;
            --accent-gradient: linear-gradient(135deg, #7cacf8, #c58af9, #d96570);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .brand-icon {
            width: 24px;
            height: 24px;
            background: var(--accent-gradient);
            border-radius: 50%;
        }

        .new-chat-btn {
            background-color: #2b2c2e;
            color: var(--text-primary);
            border: none;
            padding: 12px 16px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: #37393b;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .welcome-section {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .welcome-title {
            font-size: 3rem;
            font-weight: 500;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 3rem;
            font-weight: 500;
            color: #444746;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: auto;
        }

        .card {
            background-color: var(--bg-card);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 120px;
        }

        .card:hover {
            background-color: var(--bg-card-hover);
            transform: translateY(-2px);
        }

        .card-text {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
            padding-right: 10px;
        }

        .message {
            display: flex;
            gap: 16px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background-color: #282a2c;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            margin-left: auto;
        }

        .message.ai .avatar {
            width: 28px;
            height: 28px;
            background: var(--accent-gradient);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .message-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .input-container {
            width: 100%;
            background-color: var(--bg-input);
            border-radius: 28px;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            height: 24px;
        }

        .input-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .footer-text {
            font-size: 0.75rem;
            color: #8e918f;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <div class="brand-icon"></div>
            <span>Synapse</span>
        </div>
        <button class="new-chat-btn" onclick="resetChat()">+ New Chat</button>
    </aside>

    <main>
        <div class="content-container">
            
            <div class="welcome-section" id="welcomeSection">
                <h1 class="welcome-title">Hello, Explorer</h1>
                <h2 class="welcome-subtitle">How can Synapse help you today?</h2>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <div class="card" onclick="sendPrompt('Explain neural networks in simple terms')">
                    <p class="card-text">Explain neural networks in simple terms</p>
                </div>
                <div class="card" onclick="sendPrompt('Help me brainstorm ideas for a modern web app')">
                    <p class="card-text">Help me brainstorm ideas for a modern web app</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div>
                <div class="input-container">
                    <textarea class="input-box" id="userInput" placeholder="Enter a prompt here..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-controls">
                        <button class="send-btn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
                <p class="footer-text">Synapse may display inaccurate info, so double-check its responses.</p>
            </div>

        </div>
    </main>

    <script>
        const welcomeSection = document.getElementById('welcomeSection');
        const cardsGrid = document.getElementById('cardsGrid');
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendPrompt(promptText) {
            userInput.value = promptText;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';

            appendMessage(text, 'user');
            userInput.value = '';

            appendMessage("Synapse is thinking...", 'ai');
            const aiMessages = messagesContainer.querySelectorAll('.message.ai .message-content');
            const loadingElement = aiMessages[aiMessages.length - 1];

            try {
                const response = await fetch('/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();

                if (data.error) {
                    loadingElement.innerText = "Error: " + data.error;
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    loadingElement.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    loadingElement.innerText = "Received an unexpected response format from Gemini.";
                }
            } catch (err) {
                loadingElement.innerText = "Failed to communicate with Netlify function.";
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = sender === 'ai' 
                ? `<div class="avatar"></div><div class="message-content">${text}</div>`
                : `<div class="message-content">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function resetChat() {
            messagesContainer.innerHTML = '';
            messagesContainer.style.display = 'none';
            welcomeSection.style.display = 'block';
            cardsGrid.style.display = 'grid';
        }
    </script>
</body>
</html>
