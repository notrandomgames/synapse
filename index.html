<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse</title>
    <style>
        :root {
            /* Palette: Dark (Default) */
            --bg-main: #18181b;
            --bg-sidebar: #121215;
            --bg-card: #202024;
            --bg-card-hover: #28282d;
            --bg-input: #222226;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-warm: #d97706;
            --accent-blue: #a8c7fa;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-serif: "Georgia", "Cambria", serif;
        }

        /* Light Mode Theme Variant */
        body.light-theme {
            --bg-main: #fcfcfc;
            --bg-sidebar: #f4f4f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f1f3;
            --bg-input: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --text-primary: #18181b;
            --text-secondary: #71717a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Collapsible Sidebar */
        aside {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            transition: width 0.3s ease, padding 0.3s ease;
            position: relative;
            flex-shrink: 0;
        }

        aside.collapsed {
            width: 68px;
            padding: 16px 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .brand-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-warm), var(--accent-blue));
            flex-shrink: 0;
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .toggle-sidebar-btn:hover {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        aside.collapsed .chat-history, 
        aside.collapsed .history-title,
        aside.collapsed .brand-text,
        aside.collapsed .btn-text {
            display: none;
        }

        .history-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        /* Sidebar Footer Settings Button */
        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }

        .settings-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.88rem;
            transition: background 0.2s, color 0.2s;
        }

        .settings-btn:hover {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        /* Main Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-section {
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .welcome-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 24px;
            margin-bottom: auto;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            background-color: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .card-text {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Chat Area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-right: 8px;
            margin-bottom: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 80%;
            margin-left: auto;
        }

        .message.ai .avatar {
            width: 26px;
            height: 26px;
            background: linear-gradient(135deg, var(--accent-warm), var(--accent-blue));
            border-radius: 50%;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        /* Input Container */
        .input-container {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.98rem;
            resize: none;
            height: 24px;
        }

        .input-controls {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .send-btn {
            background: var(--text-primary);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            color: var(--bg-main);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.88;
        }

        .footer-text {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 10px;
        }

        /* Settings Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 460px;
            border-radius: 14px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label {
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .setting-select {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
        }

        .danger-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .danger-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <div class="brand-icon"></div>
                <span class="brand-text">Synapse</span>
            </div>
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <span>+</span>
            <span class="btn-text">New chat</span>
        </button>

        <div class="chat-history">
            <div class="history-title">Recent</div>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-footer">
            <button class="settings-btn" onclick="openSettings()">
                <span>⚙</span>
                <span class="btn-text">Settings</span>
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main>
        <div class="content-container">
            
            <div class="welcome-section" id="welcomeSection">
                <h1 class="welcome-title">Good day</h1>
                <h2 class="welcome-subtitle">Where would you like to begin?</h2>
            </div>

            <div class="cards-grid" id="cardsGrid">
                <div class="card" onclick="sendPrompt('Explain neural networks in simple terms')">
                    <p class="card-text">Explain neural networks in simple terms</p>
                </div>
                <div class="card" onclick="sendPrompt('Help me brainstorm ideas for a web app')">
                    <p class="card-text">Help me brainstorm ideas for a web app</p>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div>
                <div class="input-container">
                    <textarea class="input-box" id="userInput" placeholder="How can Synapse help you today?" rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-controls">
                        <button class="send-btn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
                <p class="footer-text">Synapse can make mistakes. Verify important info.</p>
            </div>

        </div>
    </main>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Settings</h3>
                <button class="close-modal-btn" onclick="closeSettings()">✕</button>
            </div>
            
            <div class="setting-group">
                <span class="setting-label">Appearance</span>
                <select class="setting-select" id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Theme</option>
                    <option value="light">Light Theme</option>
                </select>
            </div>

            <div class="setting-group">
                <span class="setting-label">Clear Chat History</span>
                <button class="danger-btn" onclick="clearAllData()">Clear All Data</button>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const welcomeSection = document.getElementById('welcomeSection');
        const cardsGrid = document.getElementById('cardsGrid');
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const historyList = document.getElementById('historyList');
        const settingsModal = document.getElementById('settingsModal');
        const themeSelect = document.getElementById('themeSelect');

        let chatSessions = JSON.parse(localStorage.getItem('synapse_chats')) || [];
        let currentSessionId = null;

        // Load saved theme preference
        const savedTheme = localStorage.getItem('synapse_theme') || 'dark';
        changeTheme(savedTheme);
        themeSelect.value = savedTheme;

        renderHistory();

        /* Sidebar Minimization */
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        /* Settings Functions */
        function openSettings() {
            settingsModal.style.display = 'flex';
        }

        function closeSettings() {
            settingsModal.style.display = 'none';
        }

        function changeTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            localStorage.setItem('synapse_theme', theme);
        }

        function clearAllData() {
            if (confirm("Are you sure you want to clear all saved chats?")) {
                localStorage.removeItem('synapse_chats');
                chatSessions = [];
                currentSessionId = null;
                startNewChat();
                closeSettings();
            }
        }

        /* Chat Logic */
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendPrompt(promptText) {
            userInput.value = promptText;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';

            if (!currentSessionId) {
                currentSessionId = Date.now().toString();
                chatSessions.unshift({ id: currentSessionId, title: text, messages: [] });
            }

            appendMessage(text, 'user');
            saveMessageToSession('user', text);
            userInput.value = '';

            appendMessage("Thinking...", 'ai');
            const aiMessages = messagesContainer.querySelectorAll('.message.ai .message-content');
            const loadingElement = aiMessages[aiMessages.length - 1];

            try {
                const response = await fetch('/.netlify/functions/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                let aiResponseText = "";

                if (data.error) {
                    aiResponseText = "Error: " + data.error;
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiResponseText = data.candidates[0].content.parts[0].text;
                } else {
                    aiResponseText = "Error: Invalid response format.";
                }

                loadingElement.innerText = aiResponseText;
                saveMessageToSession('ai', aiResponseText);

            } catch (err) {
                loadingElement.innerText = "Error connecting to serverless function.";
            }

            renderHistory();
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.innerHTML = sender === 'ai' 
                ? `<div class="avatar"></div><div class="message-content">${text}</div>`
                : `<div class="message-content">${text}</div>`;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function saveMessageToSession(sender, content) {
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages.push({ sender, content });
                localStorage.setItem('synapse_chats', JSON.stringify(chatSessions));
            }
        }

        function renderHistory() {
            historyList.innerHTML = '';
            chatSessions.forEach(session => {
                const item = document.createElement('div');
                item.classList.add('history-item');
                if (session.id === currentSessionId) item.classList.add('active');
                item.innerText = session.title;
                item.onclick = () => loadSession(session.id);
                historyList.appendChild(item);
            });
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = chatSessions.find(s => s.id === id);
            if (!session) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';
            messagesContainer.innerHTML = '';

            session.messages.forEach(msg => appendMessage(msg.content, msg.sender));
            renderHistory();
        }

        function startNewChat() {
            currentSessionId = null;
            messagesContainer.innerHTML = '';
            messagesContainer.style.display = 'none';
            welcomeSection.style.display = 'block';
            cardsGrid.style.display = 'grid';
            userInput.value = '';
            renderHistory();
        }
    </script>
</body>
</html>
