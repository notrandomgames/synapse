<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Synapse</title>
    
    <!-- Highlight.js Theme (Atom One Dark) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    
    <!-- Marked.js & Highlight.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-main: #18181b;
            --bg-sidebar: #121215;
            --bg-card: #202024;
            --bg-card-hover: #28282d;
            --bg-input: #222226;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-warm: #d97706;
            --accent-blue: #a8c7fa;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-serif: "Georgia", "Cambria", serif;
        }

        body.light-theme {
            --bg-main: #fcfcfc;
            --bg-sidebar: #f4f4f5;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f1f3;
            --bg-input: #ffffff;
            --border-color: rgba(0, 0, 0, 0.1);
            --text-primary: #18181b;
            --text-secondary: #71717a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-sans); }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 40;
        }

        aside {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            transition: transform 0.3s ease, width 0.3s ease, padding 0.3s ease;
            position: relative;
            flex-shrink: 0;
            z-index: 50;
        }

        aside.collapsed {
            width: 68px;
            padding: 16px 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        .brand-svg-logo {
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px rgba(217, 119, 6, 0.4));
            transition: filter 0.3s ease, transform 0.2s ease;
        }

        .brand-logo:hover .brand-svg-logo {
            transform: scale(1.1);
            filter: drop-shadow(0 0 10px rgba(168, 199, 250, 0.6));
        }

        .toggle-sidebar-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 8px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .toggle-sidebar-btn:hover {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        .new-chat-btn {
            background-color: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
            overflow: hidden;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .search-container {
            padding: 0 2px;
        }

        .search-box {
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--accent-blue);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        aside.collapsed .chat-history, 
        aside.collapsed .history-title,
        aside.collapsed .brand-text,
        aside.collapsed .btn-text,
        aside.collapsed .search-container {
            display: none;
        }

        .history-title {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 8px;
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .history-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .history-item:hover, .history-item.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        .history-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .item-actions {
            display: none;
            gap: 4px;
        }

        .history-item:hover .item-actions,
        .history-item.active .item-actions {
            display: flex;
        }

        .action-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }

        .action-icon-btn:hover {
            color: var(--text-primary);
            background: var(--bg-card-hover);
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .settings-btn {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s;
        }

        .settings-btn:hover {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            position: relative;
            width: 100%;
        }

        .mobile-header {
            display: none;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .mobile-menu-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.4rem;
            padding: 6px;
            cursor: pointer;
        }

        .content-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .welcome-section {
            margin-top: 40px;
            margin-bottom: 16px;
        }

        .welcome-title {
            font-family: var(--font-serif);
            font-size: 2.8rem;
            font-weight: 400;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .welcome-subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
            margin-bottom: auto;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            background-color: var(--bg-card-hover);
            border-color: var(--accent-warm);
        }

        .card-text {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-right: 4px;
            margin-bottom: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 85%;
            margin-left: auto;
        }

        .message.ai .avatar-svg {
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message-content {
            font-size: 0.95rem;
            color: var(--text-primary);
            word-break: break-word;
            width: 100%;
        }

        .message-content p { margin-bottom: 8px; }
        .message-content p:last-child { margin-bottom: 0; }

        .message-content pre {
            background: #282c34;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .message-content code {
            font-family: "Fira Code", Consolas, Monaco, "Andale Mono", monospace;
            font-size: 0.88rem;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .copy-code-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .input-container {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: var(--accent-warm);
        }

        .input-box {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            resize: none;
            height: 24px;
        }

        .input-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-warm), var(--accent-blue));
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: opacity 0.2s, transform 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }

        .footer-text {
            font-size: 0.72rem;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal-card {
            background: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 420px;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
        }

        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label { font-size: 0.9rem; color: var(--text-primary); }

        .setting-select, .export-btn, .theme-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .theme-btn:hover { border-color: var(--accent-warm); }

        .danger-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .danger-btn:hover { opacity: 0.9; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-header { display: flex; }
            .sidebar-overlay.active { display: block; }
            aside {
                position: fixed;
                top: 0; left: 0;
                height: 100vh; height: 100dvh;
                width: 280px !important;
                transform: translateX(-100%);
                box-shadow: 5px 0 25px rgba(0, 0, 0, 0.5);
            }
            aside.mobile-open { transform: translateX(0); }
            aside.collapsed .chat-history, 
            aside.collapsed .history-title,
            aside.collapsed .brand-text,
            aside.collapsed .btn-text,
            aside.collapsed .search-container { display: flex; }
            main { padding: 12px; }
            .welcome-section { margin-top: 16px; }
            .welcome-title { font-size: 2.1rem; }
            .welcome-subtitle { font-size: 0.95rem; }
            .cards-grid { grid-template-columns: 1fr; gap: 10px; margin-top: 16px; }
            .card { min-height: auto; padding: 14px; }
            .message.user .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileSidebar()"></div>

    <aside id="sidebar">
        <div class="brand">
            <div class="brand-logo" onclick="startNewChat()">
                <svg class="brand-svg-logo" viewBox="0 0 100 100" width="28" height="28">
                    <defs>
                        <linearGradient id="synapseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="var(--accent-warm, #d97706)"/>
                            <stop offset="100%" stop-color="var(--accent-blue, #a8c7fa)"/>
                        </linearGradient>
                    </defs>
                    <path d="M 65 25 C 40 15, 25 40, 50 50 C 75 60, 60 85, 35 75" 
                          fill="none" 
                          stroke="url(#synapseGlow)" 
                          stroke-width="7" 
                          stroke-linecap="round"/>
                    <circle cx="65" cy="25" r="4" fill="var(--accent-blue)"/>
                    <circle cx="35" cy="75" r="4" fill="var(--accent-warm)"/>
                    <circle cx="50" cy="50" r="6" fill="url(#synapseGlow)"/>
                    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
                </svg>
                <span class="brand-text">Synapse</span>
            </div>
            <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle Sidebar">☰</button>
        </div>

        <button class="new-chat-btn" onclick="startNewChat()">
            <span>+</span>
            <span class="btn-text">New chat</span>
        </button>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="Search chats..." oninput="filterChats(this.value)">
        </div>

        <div class="chat-history">
            <div id="pinnedSection" style="display: none;">
                <div class="history-title">Pinned</div>
                <div id="pinnedHistoryList"></div>
            </div>
            
            <div class="history-title">Recent</div>
            <div id="historyList"></div>
        </div>

        <div class="sidebar-footer">
            <button class="settings-btn" onclick="exportCurrentChatTXT()">
                <span>📄</span>
                <span class="btn-text">Export Active (.TXT)</span>
            </button>
            <button class="settings-btn" onclick="exportAllChatsJSON()">
                <span>📥</span>
                <span class="btn-text">Backup All (.JSON)</span>
            </button>
            <button class="settings-btn" onclick="openSettings()">
                <span>⚙</span>
                <span class="btn-text">Settings</span>
            </button>
        </div>
    </aside>

    <main>
        <div class="mobile-header">
            <button class="mobile-menu-btn" onclick="openMobileSidebar()">☰</button>
            <div class="brand-logo" onclick="startNewChat()">
                <svg class="brand-svg-logo" viewBox="0 0 100 100" width="24" height="24">
                    <path d="M 65 25 C 40 15, 25 40, 50 50 C 75 60, 60 85, 35 75" 
                          fill="none" 
                          stroke="url(#synapseGlow)" 
                          stroke-width="7" 
                          stroke-linecap="round"/>
                    <circle cx="65" cy="25" r="4" fill="var(--accent-blue)"/>
                    <circle cx="35" cy="75" r="4" fill="var(--accent-warm)"/>
                    <circle cx="50" cy="50" r="6" fill="url(#synapseGlow)"/>
                    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
                </svg>
                <span style="font-weight: 600;">Synapse</span>
            </div>
            <button class="mobile-menu-btn" onclick="startNewChat()">+</button>
        </div>

        <div class="content-container">
            
            <div class="welcome-section" id="welcomeSection">
                <h1 class="welcome-title">Good day</h1>
                <h2 class="welcome-subtitle">Where would you like to begin?</h2>
            </div>

            <div class="cards-grid" id="cardsGrid"></div>

            <div class="messages-container" id="messagesContainer" style="display: none;"></div>

            <div>
                <div class="input-container">
                    <textarea class="input-box" id="userInput" placeholder="How can Synapse help you today?" rows="1" onkeydown="handleKeyPress(event)"></textarea>
                    <div class="input-controls">
                        <button class="action-btn" onclick="fillRandomPrompt()" title="Insert random prompt">🎲 Surprise Prompt</button>
                        <button class="send-btn" onclick="sendMessage()">➔</button>
                    </div>
                </div>
                <p class="footer-text">Synapse can make mistakes. Verify important info.</p>
            </div>

        </div>
    </main>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Settings</h3>
                <button class="close-modal-btn" onclick="closeSettings()">✕</button>
            </div>
            
            <div class="setting-group">
                <span class="setting-label">Appearance</span>
                <select class="setting-select" id="themeSelect" onchange="changeTheme(this.value)">
                    <option value="dark">Dark Theme</option>
                    <option value="light">Light Theme</option>
                </select>
            </div>

            <div class="setting-group">
                <span class="setting-label">Accent Theme</span>
                <button class="theme-btn" onclick="generateRandomAccent()">🎨 Surprise Accent</button>
            </div>

            <div class="setting-group">
                <span class="setting-label">Clear Chat History</span>
                <button class="danger-btn" onclick="clearAllData()">Clear All Data</button>
            </div>
        </div>
    </div>

    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const welcomeSection = document.getElementById('welcomeSection');
        const cardsGrid = document.getElementById('cardsGrid');
        const messagesContainer = document.getElementById('messagesContainer');
        const userInput = document.getElementById('userInput');
        const historyList = document.getElementById('historyList');
        const pinnedHistoryList = document.getElementById('pinnedHistoryList');
        const pinnedSection = document.getElementById('pinnedSection');
        const settingsModal = document.getElementById('settingsModal');
        const themeSelect = document.getElementById('themeSelect');
        const searchInput = document.getElementById('searchInput');

        const promptBank = [
            "If animals could talk, which species would be the rudest and why?",
            "Explain quantum physics as if I am an 8-year-old",
            "Write a short, suspenseful story about a forgotten lighthouse",
            "What were the most unexpected turning points in WWII history?",
            "How does the human brain physically create and recall memories?",
            "Draft a balanced 7-day meal plan focusing on Mediterranean cuisine",
            "Design an imaginative itinerary for a 4-day weekend trip to Iceland",
            "What would happen to Earth's ecosystem if bees went extinct?",
            "Help me outline a sci-fi novel about time travel through dreams",
            "Explain how airplanes manage to fly using basic aerodynamic principles",
            "What are the philosophical differences between Stoicism and Epicureanism?",
            "Give me 5 creative themes for a themed birthday dinner party",
            "How do deep sea creatures survive extreme ocean pressure and dark?",
            "Write a persuasive speech arguing why art education is essential",
            "What are some psychological tricks to improve focus and studying habits?",
            "If humans colonized Mars, what would our daily routines look like?",
            "Explain how coffee affects the brain and body on a chemical level",
            "Create a list of unique names and backstories for a fantasy story character",
            "What caused the fall of the Roman Empire, beyond military conflicts?",
            "Give me 3 original recipe ideas using avocado, sweet potatoes, and black beans",
            "Describe what life might look like in an underground city in 2150",
            "How do telescopes catch light from galaxies billions of light-years away?",
            "Draft a thoughtful review for a fictional movie about deep ocean exploration",
            "What are the origin stories behind common everyday superstitions?",
            "Explain the difference between weather and climate using simple analogies",
            "Help me structure a 10-minute presentation on sustainable living ideas"
        ];

        let chatSessions = JSON.parse(localStorage.getItem('synapse_chats')) || [];
        let currentSessionId = null;

        const savedTheme = localStorage.getItem('synapse_theme') || 'dark';
        changeTheme(savedTheme);
        themeSelect.value = savedTheme;

        const savedWarm = localStorage.getItem('synapse_accent_warm');
        const savedBlue = localStorage.getItem('synapse_accent_blue');
        if (savedWarm && savedBlue) {
            document.documentElement.style.setProperty('--accent-warm', savedWarm);
            document.documentElement.style.setProperty('--accent-blue', savedBlue);
        }

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });

        randomizePromptCards();
        renderHistory();

        function randomizePromptCards() {
            const shuffled = [...promptBank].sort(() => 0.5 - Math.random());
            const selectedPrompts = shuffled.slice(0, 2);

            cardsGrid.innerHTML = `
                <div class="card" onclick="sendPrompt('${selectedPrompts[0].replace(/'/g, "\\'")}')">
                    <p class="card-text">${selectedPrompts[0]}</p>
                </div>
                <div class="card" onclick="sendPrompt('${selectedPrompts[1].replace(/'/g, "\\'")}')">
                    <p class="card-text">${selectedPrompts[1]}</p>
                </div>
            `;
        }

        function fillRandomPrompt() {
            const randomPrompt = promptBank[Math.floor(Math.random() * promptBank.length)];
            userInput.value = randomPrompt;
            userInput.focus();
        }

        function generateRandomAccent() {
            const hue1 = Math.floor(Math.random() * 360);
            const hue2 = (hue1 + 120 + Math.floor(Math.random() * 120)) % 360;
            
            const color1 = `hsl(${hue1}, 80%, 55%)`;
            const color2 = `hsl(${hue2}, 85%, 65%)`;

            document.documentElement.style.setProperty('--accent-warm', color1);
            document.documentElement.style.setProperty('--accent-blue', color2);

            localStorage.setItem('synapse_accent_warm', color1);
            localStorage.setItem('synapse_accent_blue', color2);
        }

        function openMobileSidebar() {
            sidebar.classList.add('mobile-open');
            sidebarOverlay.classList.add('active');
        }

        function closeMobileSidebar() {
            sidebar.classList.remove('mobile-open');
            sidebarOverlay.classList.remove('active');
        }

        function toggleSidebar() {
            if (window.innerWidth <= 768) {
                closeMobileSidebar();
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        function togglePinChat(id, event) {
            event.stopPropagation();
            const session = chatSessions.find(s => s.id === id);
            if (session) {
                session.pinned = !session.pinned;
                saveSessionsToStorage();
                renderHistory();
            }
        }

        function renameChat(id, event) {
            event.stopPropagation();
            const session = chatSessions.find(s => s.id === id);
            if (!session) return;

            const newTitle = prompt("Enter new title for this chat:", session.title);
            if (newTitle && newTitle.trim() !== '') {
                session.title = newTitle.trim();
                saveSessionsToStorage();
                renderHistory();
            }
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            if (confirm("Are you sure you want to delete this chat session?")) {
                chatSessions = chatSessions.filter(s => s.id !== id);
                saveSessionsToStorage();

                if (currentSessionId === id) {
                    startNewChat();
                } else {
                    renderHistory();
                }
            }
        }

        function saveSessionsToStorage() {
            localStorage.setItem('synapse_chats', JSON.stringify(chatSessions));
        }

        function filterChats(query) {
            const searchTerm = query.toLowerCase().trim();
            const filteredSessions = chatSessions.filter(session => {
                const titleMatches = session.title.toLowerCase().includes(searchTerm);
                const messageMatches = session.messages.some(msg => 
                    msg.content.toLowerCase().includes(searchTerm)
                );
                return titleMatches || messageMatches;
            });

            renderFilteredHistory(filteredSessions);
        }

        function createChatItemElement(session) {
            const item = document.createElement('div');
            item.classList.add('history-item');
            if (session.id === currentSessionId) item.classList.add('active');

            const titleSpan = document.createElement('span');
            titleSpan.classList.add('history-item-title');
            titleSpan.innerText = session.title;

            const actionsDiv = document.createElement('div');
            actionsDiv.classList.add('item-actions');

            const pinBtn = document.createElement('button');
            pinBtn.classList.add('action-icon-btn');
            pinBtn.innerHTML = session.pinned ? '📌' : '📍';
            pinBtn.title = session.pinned ? 'Unpin chat' : 'Pin chat';
            pinBtn.onclick = (e) => togglePinChat(session.id, e);

            const renameBtn = document.createElement('button');
            renameBtn.classList.add('action-icon-btn');
            renameBtn.innerHTML = '✏️';
            renameBtn.title = 'Rename chat';
            renameBtn.onclick = (e) => renameChat(session.id, e);

            const deleteBtn = document.createElement('button');
            deleteBtn.classList.add('action-icon-btn');
            deleteBtn.innerHTML = '🗑️';
            deleteBtn.title = 'Delete chat';
            deleteBtn.onclick = (e) => deleteChat(session.id, e);

            actionsDiv.appendChild(pinBtn);
            actionsDiv.appendChild(renameBtn);
            actionsDiv.appendChild(deleteBtn);

            item.appendChild(titleSpan);
            item.appendChild(actionsDiv);

            item.onclick = () => {
                loadSession(session.id);
                closeMobileSidebar();
            };

            return item;
        }

        function renderFilteredHistory(sessionsToRender) {
            historyList.innerHTML = '';
            pinnedHistoryList.innerHTML = '';

            const pinned = sessionsToRender.filter(s => s.pinned);
            const unpinned = sessionsToRender.filter(s => !s.pinned);

            if (pinned.length > 0) {
                pinnedSection.style.display = 'block';
                pinned.forEach(session => pinnedHistoryList.appendChild(createChatItemElement(session)));
            } else {
                pinnedSection.style.display = 'none';
            }

            if (unpinned.length === 0 && pinned.length === 0) {
                historyList.innerHTML = '<div style="font-size:0.8rem; color:var(--text-secondary); padding:8px;">No results found</div>';
            } else {
                unpinned.forEach(session => historyList.appendChild(createChatItemElement(session)));
            }
        }

        function exportCurrentChatTXT() {
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (!session) return alert("No active chat session to export.");

            let content = `SYNAPSE CHAT LOG: ${session.title}\nDate: ${new Date(parseInt(session.id)).toLocaleString()}\n\n`;
            session.messages.forEach(msg => {
                const role = msg.sender === 'user' ? 'USER' : 'SYNAPSE';
                content += `[${role}]\n${msg.content}\n\n---\n\n`;
            });

            downloadFile(`${session.title.substring(0, 20)}.txt`, content, 'text/plain');
        }

        function exportAllChatsJSON() {
            if (chatSessions.length === 0) return alert("No saved chats found.");
            const dataStr = JSON.stringify(chatSessions, null, 2);
            downloadFile('synapse_chat_backup.json', dataStr, 'application/json');
        }

        function downloadFile(filename, content, type) {
            const blob = new Blob([content], { type: type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function openSettings() {
            closeMobileSidebar();
            settingsModal.style.display = 'flex';
        }

        function closeSettings() {
            settingsModal.style.display = 'none';
        }

        function changeTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-theme');
            } else {
                document.body.classList.remove('light-theme');
            }
            localStorage.setItem('synapse_theme', theme);
        }

        function clearAllData() {
            if (confirm("Are you sure you want to clear all saved chats?")) {
                localStorage.removeItem('synapse_chats');
                chatSessions = [];
                currentSessionId = null;
                startNewChat();
                closeSettings();
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendPrompt(promptText) {
            userInput.value = promptText;
            sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';

            if (!currentSessionId) {
                currentSessionId = Date.now().toString();
                chatSessions.unshift({ id: currentSessionId, title: text, messages: [], pinned: false });
            }

            appendMessage(text, 'user');
            saveMessageToSession('user', text);
            userInput.value = '';

            appendMessage("Thinking...", 'ai');
            const aiMessages = messagesContainer.querySelectorAll('.message.ai .message-content');
            const loadingElement = aiMessages[aiMessages.length - 1];

            try {
                // Route fetch to Render's Express server endpoint
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                const data = await response.json();
                let aiResponseText = "";

                if (data.error) {
                    if (data.error.includes("Quota exceeded") || data.error.includes("rate-limits")) {
                        aiResponseText = "⚠️ Synapse is receiving too many requests right now. Please wait a minute before sending another prompt.";
                    } else {
                        aiResponseText = "Error: " + data.error;
                    }
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    aiResponseText = data.candidates[0].content.parts[0].text;
                } else {
                    aiResponseText = "Error: Invalid response format.";
                }

                loadingElement.innerHTML = marked.parse(aiResponseText);
                attachCopyButtons(loadingElement.parentElement);
                saveMessageToSession('ai', aiResponseText);

            } catch (err) {
                loadingElement.innerText = "Error connecting to backend server.";
            }

            if (searchInput.value.trim() !== '') {
                filterChats(searchInput.value);
            } else {
                renderHistory();
            }
        }

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const formattedContent = sender === 'ai' ? marked.parse(text) : text;

            // Restored neural network SVG avatar logo
            const aiAvatarSVG = `
                <svg class="avatar-svg brand-svg-logo" viewBox="0 0 100 100" width="26" height="26">
                    <path d="M 65 25 C 40 15, 25 40, 50 50 C 75 60, 60 85, 35 75" 
                          fill="none" 
                          stroke="url(#synapseGlow)" 
                          stroke-width="7" 
                          stroke-linecap="round"/>
                    <circle cx="65" cy="25" r="4" fill="var(--accent-blue)"/>
                    <circle cx="35" cy="75" r="4" fill="var(--accent-warm)"/>
                    <circle cx="50" cy="50" r="6" fill="url(#synapseGlow)"/>
                    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
                </svg>
            `;

            messageDiv.innerHTML = sender === 'ai' 
                ? `${aiAvatarSVG}<div class="message-content">${formattedContent}</div>`
                : `<div class="message-content">${text}</div>`;

            messagesContainer.appendChild(messageDiv);

            if (sender === 'ai') {
                attachCopyButtons(messageDiv);
            }

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function attachCopyButtons(container) {
            container.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-code-btn')) return;

                const button = document.createElement('button');
                button.className = 'copy-code-btn';
                button.innerText = 'Copy';

                button.addEventListener('click', () => {
                    const code = pre.querySelector('code').innerText;
                    navigator.clipboard.writeText(code).then(() => {
                        button.innerText = 'Copied!';
                        setTimeout(() => button.innerText = 'Copy', 2000);
                    });
                });

                pre.appendChild(button);
            });
        }

        function saveMessageToSession(sender, content) {
            const session = chatSessions.find(s => s.id === currentSessionId);
            if (session) {
                session.messages.push({ sender, content });
                saveSessionsToStorage();
            }
        }

        function renderHistory() {
            renderFilteredHistory(chatSessions);
        }

        function loadSession(id) {
            currentSessionId = id;
            const session = chatSessions.find(s => s.id === id);
            if (!session) return;

            welcomeSection.style.display = 'none';
            cardsGrid.style.display = 'none';
            messagesContainer.style.display = 'flex';
            messagesContainer.innerHTML = '';

            session.messages.forEach(msg => appendMessage(msg.content, msg.sender));
            renderHistory();
        }

        function startNewChat() {
            currentSessionId = null;
            messagesContainer.innerHTML = '';
            messagesContainer.style.display = 'none';
            welcomeSection.style.display = 'block';
            cardsGrid.style.display = 'grid';
            userInput.value = '';
            if (searchInput) searchInput.value = '';
            randomizePromptCards();
            renderHistory();
            closeMobileSidebar();
        }
    </script>
</body>
</html>
